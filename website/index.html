  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareSourceCode",
    "name": "react-native-journey-recovery",
    "description": "Checkpoint multi-step flows in React Native and Expo, then restore them safely after the app is killed, crashes, or the user leaves.",
    "url": "https://rn-journey-recovery.vercel.app/",
    "codeRepository": "https://github.com/Imdvlpr99/react-native-journey-recovery",

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
